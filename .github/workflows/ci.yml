name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Go Backend (vet & test -race)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: discord-clone-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: discord-clone-api/go.mod
          cache-dependency-path: discord-clone-api/go.sum
      - name: Go vet
        run: go vet ./...
      - name: Go test with race detector
        run: go test -race -count=1 ./...

  frontend:
    name: React Frontend (lint & build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: discord-clone-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: discord-clone-app/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint (oxlint)
        run: npm run lint
      - name: Typecheck and Vite build
        run: npm run build
